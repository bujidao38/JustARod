name: Build JustARod

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove bad wrapper config and let Gradle regenerate
        run: |
          rm -f gradle/wrapper/gradle-wrapper.properties

      - name: Build with Gradle
        run: ./gradlew :neoforge:build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustARod-NeoForge
          path: neoforge/build/libs/*.jar
