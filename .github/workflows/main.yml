name: Build JustARod

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Gradle manually
        run: |
          wget -q https://mirrors.cloud.tencent.com/gradle/gradle-9.5.1-bin.zip
          mkdir -p /home/runner/.gradle/wrapper/dists/gradle-9.5.1-bin/
          mv gradle-9.5.1-bin.zip /home/runner/.gradle/wrapper/dists/gradle-9.5.1-bin/

      - name: Create correct gradle-wrapper.properties
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=file\:/home/runner/.gradle/wrapper/dists/gradle-9.5.1-bin/gradle-9.5.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build with Gradle
        run: ./gradlew :neoforge:build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustARod-NeoForge
          path: neoforge/build/libs/*.jar
